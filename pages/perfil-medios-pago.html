<form action="./perfil-medios-pago.html" id="form-medios-pago" class="panel perfil-seccion">
    <div class="perfil-seccion-header">
        <h2>Medios de pago</h2>
        <p class="subtitulo-perfil">Guardá hasta 3 tarjetas para pagar más rápido en el checkout.</p>
    </div>

    <div class="contenedor-gral">
        <h3><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-card"></use></svg> Tarjetas de crédito</h3>
        <fieldset id="field-tarjeta" name="tarjeta">
            <div class="form-tarjeta">
                <p>Ingresá los datos de tus tarjetas de crédito.</p>

                <div class="oculto tarjetas-guardadas" id="div-tarjetas-guardadas">
                    <div class="oculto tarjeta-fila" id="tarjeta-fila-0"></div>
                    <div class="oculto tarjeta-fila" id="tarjeta-fila-1"></div>
                    <div class="oculto tarjeta-fila" id="tarjeta-fila-2"></div>
                </div>

                <details id="tarjetas-details">
                    <summary>Agregar tarjeta</summary>
                    <div class="contenedor-labels-grid grid-tarjeta">
                        <label class="campo label-tarjeta-1" for="nro-tarjeta">
                            <span class="campo-label">Número</span>
                            <input id="nro-tarjeta" type="tel" name="nro-tarjeta" class="input-tarj nro mono"
                                placeholder="Los 16 dígitos de la tarjeta" autocomplete="cc-number">
                        </label>

                        <label class="campo label-tarjeta-2" for="titular-tarjeta">
                            <span class="campo-label">Titular</span>
                            <input id="titular-tarjeta" type="text" name="titular-tarjeta"
                                class="input-tarj titular" placeholder="Como figura en la tarjeta"
                                autocomplete="cc-name">
                        </label>

                        <label class="campo label-tarjeta-3" for="mes-vto">
                            <span class="campo-label">Vencimiento</span>
                            <div class="vencimiento">
                                <select name="mes-vto" id="mes-vto" aria-label="Mes de vencimiento">
                                    <option value="" disabled selected hidden>Mes</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                    <option value="6">6</option>
                                    <option value="7">7</option>
                                    <option value="8">8</option>
                                    <option value="9">9</option>
                                    <option value="10">10</option>
                                    <option value="11">11</option>
                                    <option value="12">12</option>
                                </select>
                                <select name="anio-vto" id="anio-vto" aria-label="Año de vencimiento">
                                    <option value="" disabled selected hidden>Año</option>
                                    <option value="2026">2026</option>
                                    <option value="2027">2027</option>
                                    <option value="2028">2028</option>
                                    <option value="2029">2029</option>
                                    <option value="2030">2030</option>
                                    <option value="2031">2031</option>
                                    <option value="2032">2032</option>
                                    <option value="2033">2033</option>
                                    <option value="2034">2034</option>
                                    <option value="2035">2035</option>
                                </select>
                            </div>
                        </label>

                        <label class="campo label-tarjeta-4" for="documento">
                            <span class="campo-label">Documento</span>
                            <input id="documento" type="tel" name="documento" class="input-tarj titular"
                                placeholder="Número">
                        </label>

                        <label class="campo label-tarjeta-5" for="cvv">
                            <span class="campo-label">Código de seguridad (CVV)</span>
                            <input id="cvv" type="tel" name="cod-seguridad" class="input-tarj cvv mono"
                                placeholder="***" autocomplete="cc-csc">
                        </label>

                        <div class="form-boton">
                            <button type="submit" name="save" class="btn btn-primario">Guardar</button>
                        </div>
                    </div>
                </details>
            </div>
        </fieldset>
    </div>
</form>

<form action="./perfil-medios-pago.html" id="form-facturacion" class="panel perfil-seccion">
    <div class="contenedor-gral">
        <h3><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-pin"></use></svg> Facturación</h3>
        <fieldset id="field-facturacion" name="facturacion">
            <p>Completá tus datos de facturación.</p>
            <details>
                <summary>Agregar o editar tus datos de facturación</summary>
                <div class="contenedor-labels-grid grid-facturacion">
                    <label class="campo" for="pais">
                        <span class="campo-label">País</span>
                        <select id="pais" name="pais">
                            <option value="" disabled selected hidden>Seleccione un país</option>
                            <option value="alemania">Alemania</option>
                            <option value="argentina">Argentina</option>
                            <option value="australia">Australia</option>
                            <option value="bolivia">Bolivia</option>
                            <option value="brasil">Brasil</option>
                            <option value="canada">Canadá</option>
                            <option value="chile">Chile</option>
                            <option value="colombia">Colombia</option>
                            <option value="cuba">Cuba</option>
                            <option value="espana">España</option>
                            <option value="estados-unidos">Estados Unidos</option>
                            <option value="francia">Francia</option>
                            <option value="italia">Italia</option>
                            <option value="japon">Japón</option>
                            <option value="mexico">México</option>
                            <option value="paraguay">Paraguay</option>
                            <option value="peru">Perú</option>
                            <option value="reino-unido">Reino Unido</option>
                            <option value="uruguay">Uruguay</option>
                            <option value="venezuela">Venezuela</option>
                            <option value="otro">Otro</option>
                        </select>
                    </label>

                    <label class="campo" for="domicilio">
                        <span class="campo-label">Domicilio</span>
                        <input id="domicilio" type="text" name="domicilio" class="input-domicilio domicilio"
                            placeholder="Calle y número (Ej: Av. Mayo 123)">
                    </label>

                    <label class="campo" for="localidad">
                        <span class="campo-label">Localidad</span>
                        <input id="localidad" type="text" name="localidad" class="input-domicilio localidad"
                            placeholder="Ej: San Justo">
                    </label>

                    <label class="campo" for="provincia">
                        <span class="campo-label">Provincia</span>
                        <input id="provincia" type="text" name="provincia" class="input-domicilio provincia"
                            placeholder="Ej: Buenos Aires">
                    </label>

                    <label class="campo" for="cod-postal">
                        <span class="campo-label">Código postal</span>
                        <input id="cod-postal" type="text" name="cod-postal" class="input-domicilio cod-postal"
                            placeholder="Ej: 1704 o B1704ABC" maxlength="10">
                    </label>

                    <div class="form-boton">
                        <button type="submit" name="save" class="btn btn-primario">Guardar</button>
                    </div>
                </div>
            </details>
        </fieldset>
    </div>
</form>
